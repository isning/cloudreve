trigger:
  tags:
    include:
      - '*'
variables:
  GO_VERSION: "1.26.5"
  NODE_VERSION: "22.x"
  DOCKER_BUILDKIT: 1
  GHCR_IMAGE: ghcr.io/isning/cloudreve

pool:
  name: Default

jobs:
  - job: Release
    steps:
      - checkout: self
        submodules: true
        persistCredentials: true
      - task: NodeTool@0
        inputs:
          versionSpec: '$(NODE_VERSION)'
        displayName: 'Install Node.js'
      - task: GoTool@0
        inputs:
          version: "$(GO_VERSION)"
        displayName: Install Go
      - task: CmdLine@2
        displayName: Validate frontend build prerequisites
        inputs:
          script: pnpm --version
      - task: CmdLine@2
        displayName: Login to GHCR
        inputs:
          script: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$(GITHUB_USER)" --password-stdin
        env:
          GITHUB_TOKEN: $(GITHUB_TOKEN)
      - task: CmdLine@2
        displayName: "Install tonistiigi/binfmt"
        inputs:
          script: |
            docker run --privileged --rm tonistiigi/binfmt --install all
      - task: goreleaser@0
        condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/'))
        inputs:
          version: "latest"
          distribution: "goreleaser"
          workdir: "$(Build.SourcesDirectory)"
          args: "release --timeout 60m -p 4"
        env:
          GITHUB_TOKEN: $(GITHUB_TOKEN)
          GHCR_IMAGE: $(GHCR_IMAGE)
