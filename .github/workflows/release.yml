name: Build and release

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.6
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build frontend assets
        run: |
          version="$(git describe --tags --abbrev=0)"
          bash .build/build-assets.sh "${version#v}"
      - name: Build backend and run native tests
        run: |
          mkdir -p "$TMPDIR"
          go build ./...
          go test -race -count=1 -timeout=10m ./pkg/oidc ./pkg/auth ./pkg/authpolicy ./pkg/setting ./inventory ./application/dependency ./middleware ./routers/controllers ./service/user ./service/basic ./service/oauth
          go generate ./ent
          git diff --exit-code -- ent
        env:
          TMPDIR: ${{ github.workspace }}/.scratch/tmp
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.3
          args: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-assets
          path: application/statics/assets.zip
          if-no-files-found: error

  databases:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: postgres:17.6
            driver: postgres
            port: 5432
            healthcheck: pg_isready -U postgres
          - image: mysql:8.4.6
            driver: mysql
            port: 3306
            healthcheck: mysqladmin ping -h 127.0.0.1 --silent
          - image: mariadb:11.4.13
            driver: mysql
            port: 3306
            healthcheck: healthcheck.sh --connect --innodb_initialized
    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: test-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_PASSWORD: test-${{ github.run_id }}-${{ github.run_attempt }}
          MARIADB_ROOT_PASSWORD: test-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_HOST: "%"
          MARIADB_ROOT_HOST: "%"
        ports:
          - ${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.healthcheck }}"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-assets
          path: application/statics
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Provision storage test service
        run: |
          mkdir -p .scratch/multi-storage
          nix build --impure -f scripts/storage-tools.nix -o .scratch/multi-storage/tools
          echo "CLOUDREVE_S3_TEST_SERVER=$GITHUB_WORKSPACE/.scratch/multi-storage/tools/bin/weed" >> "$GITHUB_ENV"
      - name: Run native database regression tests
        run: |
          mkdir -p "$TMPDIR"
          go test -race -count=1 -timeout=15m ./routers/controllers ./inventory -run 'TestOpenID|TestLogto|TestManagedAccount|TestExternalAuth|TestStorage(LegacyGroupEdits|LegacyDefaultChanges|ConcurrentStartup|PartialInitialization|PartialRelocationJournalUpgrade|V3JournalUpgrade|RelocationSplitsOnlySelectedSharedVersions|RelocationTwoWorkersCommitOnlyOnce|RelocationExpiredWorkerCannotOverwriteWinningCommit|RelocationRestartsAtPlanAndVerifiedBoundaries|RelocationRecoversCommittedJournalBeforeTaskProgress|RelocationRechecksMissingOrInvalidVerification)'
        env:
          TMPDIR: ${{ github.workspace }}/.scratch/tmp
          OIDC_TEST_DRIVER: ${{ matrix.driver }}
          CLOUDREVE_STORAGE_INTEGRATION: "1"
          OIDC_TEST_DSN: ${{ matrix.driver == 'postgres' && format('postgres://postgres:test-{0}-{1}@127.0.0.1:{2}/postgres?sslmode=disable', github.run_id, github.run_attempt, job.services.database.ports['5432']) || format('root:test-{0}-{1}@tcp(127.0.0.1:{2})/mysql?parseTime=true', github.run_id, github.run_attempt, job.services.database.ports['3306']) }}

  storage:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-assets
          path: application/statics
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Provision storage test service
        run: |
          mkdir -p .scratch/multi-storage
          nix build --impure -f scripts/storage-tools.nix -o .scratch/multi-storage/tools
          echo "CLOUDREVE_S3_TEST_SERVER=$GITHUB_WORKSPACE/.scratch/multi-storage/tools/bin/weed" >> "$GITHUB_ENV"
      - name: Run native storage regression tests
        run: |
          mkdir -p "$TMPDIR"
          mapfile -t cases < <(go test ./routers/controllers -list '^TestStorage' | awk '/^TestStorage/ && $0 != "TestStorageStartupWorker" && $0 != "TestStorageRuntimeImageWorkflow"')
          selected=()
          for ((i=STORAGE_SHARD; i<${#cases[@]}; i+=4)); do
            selected+=("${cases[i]}")
          done
          [[ "${#selected[@]}" -gt 0 ]]
          pattern="$(IFS='|'; echo "${selected[*]}")"
          go test -v -race -count=1 -timeout=30m ./routers/controllers -run "^($pattern)$"
        env:
          TMPDIR: ${{ github.workspace }}/.scratch/tmp
          CLOUDREVE_STORAGE_INTEGRATION: "1"
          STORAGE_SHARD: ${{ matrix.shard }}

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [test, databases, storage]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.6
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set the fork image repository
        run: printf 'GHCR_IMAGE=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.3
          args: release --timeout 60m -p 4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
