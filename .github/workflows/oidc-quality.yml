name: OIDC release gates

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oidc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-frontend
          path: application/statics
      - run: python3 scripts/verify.py --stage backend
      - run: python3 scripts/test_release_tools.py
      - name: Check generated schema
        run: |
          go generate ./ent
          git diff --exit-code -- ent
        env:
          TMPDIR: ${{ github.workspace }}/.scratch/oidc-pro/tmp

  databases:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: postgres:17.6
            driver: postgres
            port: 5432
          - image: mysql:8.4.6
            driver: mysql
            port: 3306
          - image: mariadb:11.4.13
            driver: mysql
            port: 3306
    services:
      database:
        image: ${{ matrix.image }}
        env:
          # Disposable runner-local credentials, generated from this CI run.
          POSTGRES_PASSWORD: test-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_PASSWORD: test-${{ github.run_id }}-${{ github.run_attempt }}
          MARIADB_ROOT_PASSWORD: test-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_HOST: "%"
          MARIADB_ROOT_HOST: "%"
        ports:
          - ${{ matrix.port }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-frontend
          path: application/statics
      - name: Database HTTP, lifecycle and migration gates
        run: python3 scripts/verify.py --stage database
        env:
          OIDC_TEST_DRIVER: ${{ matrix.driver }}
          OIDC_TEST_DSN: ${{ matrix.driver == 'postgres' && format('postgres://postgres:test-{0}-{1}@127.0.0.1:{2}/postgres?sslmode=disable', github.run_id, github.run_attempt, job.services.database.ports['5432']) || format('root:test-{0}-{1}@tcp(127.0.0.1:{2})/mysql?parseTime=true', github.run_id, github.run_attempt, job.services.database.ports['3306']) }}

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The frontend is maintained and published in its own fork.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.6
      - run: python3 scripts/build-frontend.py --stage all
      - name: Browser dependencies
        working-directory: scripts/e2e
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.scratch/oidc-pro/tmp/playwright
      - name: Production bundle browser regressions
        working-directory: scripts/e2e
        run: pnpm test
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.scratch/oidc-pro/tmp/playwright
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-evidence
          include-hidden-files: true
          path: |
            .scratch/oidc-pro/tmp/browser-results
            .scratch/oidc-pro/tmp/browser-junit.xml
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build the deliverable with embedded assets
        run: go build -o .scratch/oidc-pro/tmp/cloudreve .
        env:
          TMPDIR: ${{ github.workspace }}/.scratch/oidc-pro/tmp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-frontend
          path: application/statics/assets.zip
          if-no-files-found: error
