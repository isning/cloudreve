name: Authentication and storage release gates

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oidc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  backend:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-frontend
          path: application/statics
      - run: python3 scripts/verify.py --stage backend
      - run: python3 scripts/test_release_tools.py
      - name: Check generated schema
        run: |
          go generate ./ent
          git diff --exit-code -- ent
        env:
          TMPDIR: ${{ github.workspace }}/.scratch/oidc-pro/tmp

  databases:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: postgres:17.6
            driver: postgres
            port: 5432
          - image: mysql:8.4.6
            driver: mysql
            port: 3306
          - image: mariadb:11.4.13
            driver: mysql
            port: 3306
    services:
      database:
        image: ${{ matrix.image }}
        env:
          # Disposable runner-local credentials, generated from this CI run.
          POSTGRES_PASSWORD: test-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_PASSWORD: test-${{ github.run_id }}-${{ github.run_attempt }}
          MARIADB_ROOT_PASSWORD: test-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_HOST: "%"
          MARIADB_ROOT_HOST: "%"
        ports:
          - ${{ matrix.port }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-frontend
          path: application/statics
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Provision pinned storage test tools
        run: |
          mkdir -p .scratch/multi-storage
          nix build --impure -f scripts/storage-tools.nix -o .scratch/multi-storage/tools
          echo "CLOUDREVE_S3_TEST_SERVER=$GITHUB_WORKSPACE/.scratch/multi-storage/tools/bin/weed" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.scratch/multi-storage/tools/bin" >> "$GITHUB_PATH"
      - name: Database HTTP, lifecycle and migration gates
        run: |
          python3 scripts/verify.py --stage database
          python3 scripts/verify-storage.py --stage database
        env:
          OIDC_TEST_DRIVER: ${{ matrix.driver }}
          OIDC_TEST_DSN: ${{ matrix.driver == 'postgres' && format('postgres://postgres:test-{0}-{1}@127.0.0.1:{2}/postgres?sslmode=disable', github.run_id, github.run_attempt, job.services.database.ports['5432']) || format('root:test-{0}-{1}@tcp(127.0.0.1:{2})/mysql?parseTime=true', github.run_id, github.run_attempt, job.services.database.ports['3306']) }}

  storage:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-frontend
          path: application/statics
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Provision pinned storage test tools
        run: |
          mkdir -p .scratch/multi-storage
          nix build --impure -f scripts/storage-tools.nix -o .scratch/multi-storage/tools
          echo "CLOUDREVE_S3_TEST_SERVER=$GITHUB_WORKSPACE/.scratch/multi-storage/tools/bin/weed" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.scratch/multi-storage/tools/bin" >> "$GITHUB_PATH"
      - name: Native HTTP, S3, recovery and lifecycle acceptance
        run: python3 scripts/verify-storage.py --stage native --shards 4 --shard "$STORAGE_SHARD"
        env:
          STORAGE_SHARD: ${{ matrix.shard }}

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The frontend is maintained and published in its own fork.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.6
      - name: Build the pinned frontend
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python3 scripts/build-frontend.py --stage all --version "$RELEASE_TAG"
          else
            python3 scripts/build-frontend.py --stage all
          fi
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - name: Browser dependencies
        working-directory: scripts/e2e
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.scratch/oidc-pro/tmp/playwright
      - name: Production bundle browser regressions
        working-directory: scripts/e2e
        run: pnpm test
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.scratch/oidc-pro/tmp/playwright
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-evidence
          include-hidden-files: true
          path: |
            .scratch/oidc-pro/tmp/browser-results
            .scratch/oidc-pro/tmp/browser-junit.xml
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Provision pinned storage test tools
        run: |
          mkdir -p .scratch/multi-storage
          nix build --impure -f scripts/storage-tools.nix -o .scratch/multi-storage/tools
          echo "CLOUDREVE_S3_TEST_SERVER=$GITHUB_WORKSPACE/.scratch/multi-storage/tools/bin/weed" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.scratch/multi-storage/tools/bin" >> "$GITHUB_PATH"
      - name: Native browser, HTTP and S3 acceptance
        run: python3 scripts/verify-storage.py --stage browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.scratch/oidc-pro/tmp/playwright
      - name: Build the deliverable with embedded assets
        run: go build -o .scratch/oidc-pro/tmp/cloudreve .
        env:
          TMPDIR: ${{ github.workspace }}/.scratch/oidc-pro/tmp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-frontend
          path: application/statics/assets.zip
          if-no-files-found: error

  image:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [frontend, backend, databases, storage]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      IMAGE_CONTEXT: ${{ github.workspace }}/.scratch/oidc-pro/tmp/image-context
      TMPDIR: ${{ github.workspace }}/.scratch/oidc-pro/tmp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate image tag and prepare build context
        id: metadata
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Git tag must be a valid container tag (1-128 letters, digits, underscores, dots or hyphens)" >&2
            exit 1
          fi
          printf 'image=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          mkdir -p "$IMAGE_CONTEXT/.build"
          cp Dockerfile "$IMAGE_CONTEXT/"
          cp .build/entrypoint.sh .build/aria2.supervisor.conf "$IMAGE_CONTEXT/.build/"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-frontend
          path: application/statics
      - name: Compile the native release binary with verified assets
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/cloudreve/Cloudreve/v4/application/constants.BackendVersion=$RELEASE_TAG -X github.com/cloudreve/Cloudreve/v4/application/constants.LastCommit=${GITHUB_SHA:0:7}" \
            -o "$IMAGE_CONTEXT/cloudreve" .
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the runtime image for smoke testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ env.IMAGE_CONTEXT }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: cloudreve-ci:${{ matrix.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=cloudreve-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cloudreve-image-${{ matrix.arch }}
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Provision pinned storage test tools
        run: |
          mkdir -p .scratch/multi-storage
          nix build --impure -f scripts/storage-tools.nix -o .scratch/multi-storage/tools
          echo "CLOUDREVE_S3_TEST_SERVER=$GITHUB_WORKSPACE/.scratch/multi-storage/tools/bin/weed" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.scratch/multi-storage/tools/bin" >> "$GITHUB_PATH"
      - name: Verify runtime image storage behavior
        run: python3 scripts/verify-storage.py --stage image
        env:
          CLOUDREVE_STORAGE_IMAGE: cloudreve-ci:${{ matrix.arch }}
          CLOUDREVE_CONTAINER_ENGINE: docker
      - name: Verify packaged startup and frontend/backend versions
        run: python3 scripts/verify-image.py --image "$SMOKE_IMAGE" --version "$RELEASE_TAG"
        env:
          SMOKE_IMAGE: cloudreve-ci:${{ matrix.arch }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only digests are published here; the release tag appears after both platforms pass.
      - name: Push the tested platform image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ env.IMAGE_CONTEXT }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.metadata.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=cloudreve-image-${{ matrix.arch }}
      - name: Record the platform digest
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p .scratch/oidc-pro/tmp/image-digests
          touch ".scratch/oidc-pro/tmp/image-digests/${IMAGE_DIGEST#sha256:}"
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: .scratch/oidc-pro/tmp/image-digests/*
          include-hidden-files: true
          if-no-files-found: error

  publish-image:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify the multi-platform tag
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          digests=(image-digests/*)
          [[ "${#digests[@]}" == 2 ]]
          references=()
          for path in "${digests[@]}"; do
            digest="${path##*/}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            references+=("$image@sha256:$digest")
          done
          docker buildx imagetools create --tag "$image:$RELEASE_TAG" "${references[@]}"
          docker buildx imagetools inspect "$image:$RELEASE_TAG" --raw > image-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('image-manifest.json').read_text())
          platforms = [(item['platform']['os'], item['platform']['architecture']) for item in manifest['manifests']]
          assert sorted(platforms) == [('linux', 'amd64'), ('linux', 'arm64')], platforms
          PY
          docker buildx imagetools inspect "$image:$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
